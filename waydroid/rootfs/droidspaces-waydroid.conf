# Waydroid on Droidspaces - settings
#
# This one file configures four things. It lives inside the rootfs at
# /system/etc/droidspaces-waydroid.conf and is read on every boot.
#
#   gpu.*      whether Android draws with the phone's Adreno GPU
#   bridge.*   the display bridge that shows Android in the Anland app
#   init.*     the small starter program (/sbin/init)
#   anything else is an Android system property (copied to /vendor/waydroid.prop)

# ---------------------------------------------------------------------------
# GPU
# ---------------------------------------------------------------------------

# On Snapdragon phones Android can draw with the Adreno GPU (Mesa freedreno
# through /dev/kgsl-3d0). This needs Hardware Access turned on in the
# container settings. Everywhere else Android draws with the CPU (SwiftShader),
# which is slow and makes the phone warm.
#
#   auto  use the GPU when /dev/kgsl-3d0 and a dma-buf heap can be opened
#   on    always use the GPU driver (for troubleshooting)
#   off   always draw with the CPU
#
# /ds-waydroid-boot.log says which one was chosen and why (lines "gpu: ...").
gpu.mode=auto

# Also offer Vulkan (Mesa turnip) to apps and games. Off by default: Android's
# own interface keeps using OpenGL ES either way, and a few apps behave worse
# when they find Vulkan.
gpu.vulkan=0

# ---------------------------------------------------------------------------
# Display bridge
# ---------------------------------------------------------------------------

# The number of pixels and frames decides how sharp and smooth Android looks
# and how warm the phone gets:
#
#   render_scale  percentage of the real screen resolution Android renders at.
#                 100 is a sharp picture. 50 means a quarter of the pixels; the
#                 picture is enlarged to fill the screen and looks blurry.
#   max_fps       how many pictures per second Android may produce.
#
# "auto" picks 100 and 60 when Android draws with the GPU, and 50 and 30 when
# it draws with the CPU. A number overrides it, for example render_scale=75 on
# a slow phone, or max_fps=90 on a phone with a 90 Hz screen.
bridge.render_scale=auto
bridge.max_fps=auto

# When Android draws with the GPU, the GPU also copies each finished picture
# into the Anland app's screen buffer (and smooths it when render_scale is
# below 100). 0 makes the CPU do the copy, as it does in CPU mode.
bridge.gpu_copy=auto

# Android picks its screen density once at start. With this set, the density is
# chosen so the short side of the screen is this many "dp" wide (about 400 looks
# like a normal phone, larger numbers make everything smaller). Set to 0 and add
# a line like ro.sf.lcd_density=320 below to fix the density yourself.
bridge.ui_width_dp=400

# How many seconds Android's display start waits for the Anland app, so it can
# use the app's real screen size from the beginning. After that it starts with
# the default size below and switches when the app connects.
bridge.wait_for_display=20
bridge.default_width=1080
bridge.default_height=1920

# Messages from the bridge. Readable from the host inside the rootfs folder.
bridge.log=/ds-waydroid-bridge.log
bridge.verbose=0

# ---------------------------------------------------------------------------
# Starter program
# ---------------------------------------------------------------------------

# Leave these alone unless asked to change them while troubleshooting.
#init.stage=second
#init.keep_host_cmdline=1
#init.ignore_errors=1
#init.unprotected=1

# ---------------------------------------------------------------------------
# Android properties
# ---------------------------------------------------------------------------

# ro.hardware.gralloc, ro.hardware.egl and mesa.loader.driver.override are set
# by /sbin/init from gpu.mode above. Setting them here overrides that choice.

# Show the full Android screen as soon as it boots.
waydroid.background_start=false
persist.waydroid.multi_windows=false

# Where the Android composer finds the bridge. Must match the bridge defaults.
waydroid.xdg_runtime_dir=/run/xdg
waydroid.wayland_display=wayland-0
waydroid.pulse_runtime_path=/run/xdg/pulse

# No Waydroid host services exist here.
waydroid.stub_sensors_hal=1
waydroid.updater.disabled=true
waydroid.tools_version=droidspaces
ro.vndk.lite=true
ro.adb.secure=1
ro.debuggable=0
